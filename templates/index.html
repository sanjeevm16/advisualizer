<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Asset Factory - Ad Visualizer</title>
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Custom Premium Stylesheet -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container py-5">
        <!-- Brand Header -->
        <header class="text-center mb-5">
            <h1 class="display-4 fw-extrabold mb-2">AI Asset Factory</h1>
            <p class="lead text-secondary">Orchestrated Multi-Agent Visual Marketing & Ad Placement Suite</p>
        </header>

        <!-- Main Dashboard Grid -->
        <div class="row g-4">
            
            <!-- Orchestrator Chat Terminal -->
            <div class="col-lg-6">
                <div class="glass-panel p-4 h-100 d-flex flex-column">
                    <h4 class="mb-3 d-flex align-items-center justify-content-between">
                        <span>Orchestrator Terminal</span>
                        <span class="badge bg-success-subtle text-success fs-7 fw-semibold border border-success-subtle">Active</span>
                    </h4>
                    
                    <!-- Workflow Flow Tracker -->
                    <div class="flow-tracker" id="flowTracker">
                        <div class="flow-step step-ta" id="step-trend">
                            <span class="flow-dot"></span>
                            <span class="flow-label">Trend Analyst</span>
                        </div>
                        <div class="flow-step step-pc" id="step-product">
                            <span class="flow-dot"></span>
                            <span class="flow-label">Product Copier</span>
                        </div>
                        <div class="flow-step step-sc" id="step-scene">
                            <span class="flow-dot"></span>
                            <span class="flow-label">Scene Compositor</span>
                        </div>
                        <div class="flow-step step-ab" id="step-ab">
                            <span class="flow-dot"></span>
                            <span class="flow-label">Variant Gen</span>
                        </div>
                    </div>

                    <!-- Chat Log -->
                    <div class="chat-container flex-grow-1 mb-3" id="chatBox">
                        <div class="message-bubble msg-system">
                            System: Orchestrator ready. Ask to launch a brand placement, visual campaign, or generate variant tests.
                        </div>
                    </div>

                    <!-- Input Controls -->
                    <div class="modern-input-group">
                        <!-- Mic Button (Speech-to-Text) -->
                        <button class="voice-btn" id="micBtn" title="Speech to Text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M5 3a3 3 0 0 1 6 0v5a3 3 0 0 1-6 0z"/>
                                <path d="M3.5 6.5A.5.5 0 0 1 4 7v1a4 4 0 0 0 8 0V7a.5.5 0 0 1 1 0v1a5 5 0 0 1-4.5 4.975V15h3a.5.5 0 0 1 0 1h-7a.5.5 0 0 1 0-1h3v-2.025A5 5 0 0 1 3 8V7a.5.5 0 0 1 .5-.5z"/>
                            </svg>
                        </button>
                        
                        <!-- Text Input -->
                        <input type="text" id="userInput" class="modern-input" placeholder="Ask to generate an ad campaign...">
                        
                        <!-- Voice Output Toggle -->
                        <button class="voice-btn" id="voiceToggleBtn" title="Toggle Voice Output (TTS)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M11.536 14.01A8.47 8.47 0 0 0 14.026 8a8.47 8.47 0 0 0-2.49-6.01l-.708.707A7.48 7.48 0 0 1 13.025 8c0 2.071-.84 3.946-2.197 5.303z"/>
                                <path d="M10.121 12.596A6.48 6.48 0 0 0 12.025 8a6.48 6.48 0 0 0-1.904-4.596l-.707.707A5.48 5.48 0 0 1 11.025 8a5.48 5.48 0 0 1-1.61 3.89z"/>
                                <path d="M8.707 11.182A4.5 4.5 0 0 0 10.025 8a4.5 4.5 0 0 0-1.318-3.182L8 5.525A3.5 3.5 0 0 1 9.025 8 3.5 3.5 0 0 1 8 10.475zM6.717 3.55A.5.5 0 0 1 7 4v8a.5.5 0 0 1-.812.39L3.825 10.5H1.5A.5.5 0 0 1 1 10V6a.5.5 0 0 1 .5-.5h2.325l2.363-1.89a.5.5 0 0 1 .529-.06z"/>
                            </svg>
                        </button>

                        <!-- Send Button -->
                        <button class="modern-btn" id="sendBtn">Send</button>
                    </div>
                </div>
            </div>
            
            <!-- Asset Gallery Section -->
            <div class="col-lg-6">
                <div class="glass-panel p-4 h-100 d-flex flex-column">
                    <h4 class="mb-4">Creative Asset Gallery</h4>
                    <div class="row g-3 flex-grow-1 align-content-start overflow-y-auto" style="max-height: 560px;" id="assetLibrary">
                        <!-- Populated dynamically via JS -->
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Application JS -->
    <script src="/static/app.js"></script>
</body>
</html>
